server:
  port: 8083

spring:
  application:
    name: webhook-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: webhook-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payflow?currentSchema=webhooks
    username: payflow
    password: payflow
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS merchants
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: webhooks
  flyway:
    enabled: true
    schemas: webhooks
    default-schema: webhooks
    locations: classpath:db/migration

payflow:
  webhook:
    max-endpoints-per-merchant: 5
    signature-header: Payflow-Signature
    retry-poll-ms: 5000
  kafka:
    dlq-topic: webhook.dlq
  internal:
    dispatch-enabled: true
  api-key-cache:
    ttl-seconds: 600
    max-size: 10000
    internal-endpoint:
      base-url: ${PAYFLOW_API_KEY_CACHE_INTERNAL_ENDPOINT_BASE_URL:http://localhost:8082}
      path: /v1/internal/merchants/validate-key

# Observability: Spring Boot Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
