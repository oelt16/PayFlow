server:
  port: 8081

spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payflow
    username: payflow
    password: payflow
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS merchants
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: payments
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: payments
    default-schema: payments
    create-schemas: true

payflow:
  outbox:
    poll-interval-ms: 500
    batch-size: 100
    topic: payments.events
    send-timeout-seconds: 30
  api-key-cache:
    ttl-seconds: 600
    max-size: 10000
    internal-endpoint:
      base-url: ${PAYFLOW_API_KEY_CACHE_INTERNAL_ENDPOINT_BASE_URL:http://localhost:8082}
      path: /v1/internal/merchants/validate-key
  rate-limit:
    enabled: true
    requests-per-minute: 100
    burst-capacity: 20
    cache-max-size: 10000
    cache-ttl: 30m
    endpoints:
      payments-create:
        method: POST
        path: /v1/payments
        tokens: 20
        refill-duration: 1m

# Observability: Spring Boot Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
