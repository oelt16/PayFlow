server:
  port: 8082

spring:
  application:
    name: merchant-service
  config:
    import: "optional:aws-secretsmanager:/payflow/${ENVIRONMENT:local}/merchant-service/db?prefix=db."
  kafka:
    bootstrap-servers: ${PAYFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: org.postgresql.Driver
  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: merchants
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: merchants
    default-schema: merchants
    create-schemas: true

springdoc:
  api-docs:
    path: /merchant/v3/api-docs
  paths-to-match: /v1/**
  swagger-ui:
    path: /merchant/swagger-ui.html
    url: /merchant/v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

payflow:
  outbox:
    poll-interval-ms: 500
    batch-size: 100
    topic: merchant.events
    send-timeout-seconds: 30
  rate-limit:
    enabled: true
    requests-per-minute: 100
    burst-capacity: 20
    cache-max-size: 10000
    cache-ttl: 30m
    endpoints:
      api-keys-create:
        method: POST
        path: /v1/merchants/me/api-keys
        tokens: 3
        refill-duration: 1h

# Observability: Spring Boot Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
