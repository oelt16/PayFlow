# PayFlow local dev stack with Floci AWS emulation.
# Startup sequence:
#   1. docker compose -f infra/docker-compose-floci.yml up -d floci
#   2. terraform -chdir=infra/terraform apply
#   3. docker compose -f infra/docker-compose-floci.yml up --build
name: payflow

services:
  # =========================================================================
  # AWS Emulator
  # =========================================================================
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
      - "7001-7003:7001-7003"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_DOCKER_NETWORK: infra_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # =========================================================================
  # Infrastructure (spec section 10.1)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payflow} -d ${POSTGRES_DB:-payflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      floci:
        condition: service_healthy

  # Official ASF image (same family as Testcontainers: apache/kafka). Pinned; see https://hub.docker.com/r/apache/kafka/tags
  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    depends_on:
      floci:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: payflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      floci:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================================================================
  # Application Services
  # =========================================================================
  payment-service:
    build:
      context: ../backend
      dockerfile: payment-service/Dockerfile
    ports:
      - "${PAYMENT_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYFLOW_API_KEY_CACHE_INTERNAL_ENDPOINT_BASE_URL: http://merchant-service:8082
    depends_on:
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  merchant-service:
    build:
      context: ../backend
      dockerfile: merchant-service/Dockerfile
    ports:
      - "${MERCHANT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  webhook-service:
    build:
      context: ../backend
      dockerfile: webhook-service/Dockerfile
    ports:
      - "${WEBHOOK_SERVICE_PORT:-8083}:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payflow}?currentSchema=webhooks
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYFLOW_API_KEY_CACHE_INTERNAL_ENDPOINT_BASE_URL: http://merchant-service:8082
      PAYFLOW_WEBHOOK_ALLOW_HTTP: "true"
    depends_on:
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYFLOW_WEBHOOK_DISPATCH_BASE_URL: http://webhook-service:8083
    depends_on:
      floci:
        condition: service_healthy
      kafka:
        condition: service_healthy
      webhook-service:
        condition: service_started

  # Local webhook receiver for testing (register this URL in the UI)
  webhook-receiver:
    build:
      context: ../webhook-receiver
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      floci:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      floci:
        condition: service_healthy
      payment-service:
        condition: service_started
      merchant-service:
        condition: service_started
      webhook-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # Observability
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      floci:
        condition: service_healthy
      payment-service:
        condition: service_started
      merchant-service:
        condition: service_started
      webhook-service:
        condition: service_started
      notification-service:
        condition: service_started

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      floci:
        condition: service_healthy
      prometheus:
        condition: service_started

  zipkin:
    image: openzipkin/zipkin:2.24
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    environment:
      - STORAGE_TYPE=mem
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      floci:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  floci_data:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
